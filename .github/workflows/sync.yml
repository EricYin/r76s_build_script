name: Sync to Branch

on:
  workflow_dispatch: # 手动触发按钮

jobs:
  run-and-sync:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write       

    steps:
    - name: Fix Git Long Paths Configuration
      run: |
        git config --global core.longpaths true
        git config --global core.symlinks false

    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        path: git_repo
        # 获取所有分支和历史，确保能够顺利推送到远程
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Run Go Script
      run: go run ./git_repo/sync/cooluc.go

    - name: List and Copy Files
      run: |
        echo "=== 1. Summary of downloaded content ==="
        DIR_COUNT=$(find download_dir -mindepth 1 -type d | wc -l)
        FILE_COUNT=$(find download_dir -type f | wc -l)
        
        echo "Total Directories: $DIR_COUNT"
        echo "Total Files: $FILE_COUNT"
        
        echo "=== 2. Listing downloaded files ==="
        find download_dir
        
        echo "=== 3. Copying files to git directory ==="
        cp -rf download_dir/* git_repo/

    - name: Check Changes and Push to Temp Branch
      run: |
        cd git_repo
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        
        if [ -n "$(git status --porcelain)" ]; then
          echo "Changes detected, cleaning up old branch if exists..."
          TEMP_BRANCH="auto-update-files-${{ github.ref_name }}"
          
          # 1. 强行删除本地已存在的同名临时分支（如果有，|| true 防止没有分支时报错中断）
          git branch -D "$TEMP_BRANCH" || true
          
          # 2. 强行删除远程已存在的同名临时分支（如果有）
          git push origin --delete "$TEMP_BRANCH" || true
          
          echo "Creating and shifting to the fresh temporary branch..."
          # 3. 重新创建并切换到干净的临时分支
          git checkout -b "$TEMP_BRANCH"
          
          git add .
          git commit -m "Manual auto-update files via cooluc.go"
          git push origin "$TEMP_BRANCH" --force
          
          echo "Successfully pushed changes to branch: $TEMP_BRANCH"
        else
          echo "=========================================="
          echo "NOTICE: No updates found. Content is identical!"
          echo "=========================================="
          echo "### 📢 Notice: No updates found. No branch was created/updated." >> $GITHUB_STEP_SUMMARY
        fi
